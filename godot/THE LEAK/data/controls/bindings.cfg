; Управление THE LEAK — единственное место, где задаются кнопки (scripts/controls/controls.gd читает при запуске).
; Секция = действие. label — подпись в настройках, group — раздел страницы «Управление» (пусто — не показывать),
; keys — клавиатура/мышь по умолчанию: "k:<physical_keycode>" | "m:<кнопка мыши>" (первая — основная, вторая — альтернативная),
; pad — кнопка геймпада по умолчанию: "b:N" кнопка, "c:N" Back + кнопка, "t:L"/"t:R" курок; pad_axis — ось стика (lx-, ly+…),
; pad_raw=true — кнопку геймпада проверяет само окно (Controls.event), gamepad.gd её не шлёт,
; modes — в каких режимах действие работает: game (пешком), car (в машине), inventory (открыто окно/инвентарь),
;   menu (пауза/главное меню), console (консоль/чат). Сверху стека — самый важный режим: console > menu > inventory > car > game.
; hint — буквы подсказок «[F]», которые означают это действие (старые тексты подсказок; новые пишем «{interact}»).
; Переназначения игрока — user://controls.cfg поверх этой таблицы.

